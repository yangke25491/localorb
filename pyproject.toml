[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localorb"
version = "0.2.0"
description = "Structure-aware local orbital frames for Wannier90 and VASP workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "localorb contributors"}]
dependencies = [
  "numpy>=1.24",
  "pymatgen>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
localorb = "localorb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
